services:
  trace:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DB_PATH: /data/investigations.sqlite3
    volumes:
      - reports:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  reports:
