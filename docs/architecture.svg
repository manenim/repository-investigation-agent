<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#245b47"/></marker></defs><rect width="1040" height="390" fill="#f6f5f0"/><text x="30" y="30" font-family="sans-serif" font-size="17" fill="#245b47">TRACE / Explicit workflow and evidence boundaries</text><rect x="30" y="55" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="45" y="92" font-family="sans-serif" font-size="15" fill="#242b29">Web form</text><text x="45" y="120" font-family="sans-serif" font-size="11" fill="#68716b">Authenticated submission</text><rect x="275" y="55" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="290" y="92" font-family="sans-serif" font-size="15" fill="#242b29">FastAPI + queue</text><text x="290" y="120" font-family="sans-serif" font-size="11" fill="#68716b">1 active / 4 waiting</text><rect x="520" y="55" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="535" y="92" font-family="sans-serif" font-size="15" fill="#242b29">GitHub GET adapter</text><text x="535" y="120" font-family="sans-serif" font-size="11" fill="#68716b">Public allowlist → commit SHA</text><rect x="765" y="55" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="780" y="92" font-family="sans-serif" font-size="15" fill="#242b29">Bounded retrieval</text><text x="780" y="120" font-family="sans-serif" font-size="11" fill="#68716b">Original lines + evidence IDs</text><rect x="765" y="235" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="780" y="272" font-family="sans-serif" font-size="15" fill="#242b29">Document + investigate</text><text x="780" y="300" font-family="sans-serif" font-size="11" fill="#68716b">Typed claims and proposals</text><rect x="520" y="235" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="535" y="272" font-family="sans-serif" font-size="15" fill="#242b29">Independent verification</text><text x="535" y="300" font-family="sans-serif" font-size="11" fill="#68716b">Blob / line checks + support</text><rect x="275" y="235" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="290" y="272" font-family="sans-serif" font-size="15" fill="#242b29">SQLite / Postgres</text><text x="290" y="300" font-family="sans-serif" font-size="11" fill="#68716b">Reports + immutable source</text><rect x="30" y="235" width="220" height="100" rx="7" fill="#fffefa" stroke="#bfcbbb"/><text x="45" y="272" font-family="sans-serif" font-size="15" fill="#242b29">Human review + export</text><text x="45" y="300" font-family="sans-serif" font-size="11" fill="#68716b">Markdown / JSON</text><path d="M250 105 L275 105" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M495 105 L520 105" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M740 105 L765 105" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M875 155 L875 235" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M765 285 L740 285" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M520 285 L495 285" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><path d="M275 285 L250 285" stroke="#245b47" fill="none" marker-end="url(#arrow)"/><text x="30" y="370" font-family="sans-serif" font-size="12" fill="#68716b">Untrusted source and issues are data. Models have no tools. No target code is executed. All fixes remain proposals.</text></svg>